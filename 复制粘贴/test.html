<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切屏检测防护测试 v2.0</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; text-align: center; }
        .section { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .section h2 { margin-top: 0; color: #666; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .status { padding: 12px; border-radius: 4px; margin: 10px 0; font-size: 14px; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
        .info { background: #e3f2fd; color: #1565c0; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        .shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .shortcut { padding: 10px; background: #f5f5f5; border-radius: 4px; font-size: 13px; text-align: center; }
        .shortcut code { background: #333; color: #fff; padding: 2px 6px; border-radius: 3px; }
        iframe { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 4px; }
        #detection-log { max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 4px; }
        .log-item { margin: 2px 0; }
        .log-blocked { color: #4caf50; }
        .log-triggered { color: #f44336; }
        .log-info { color: #2196f3; }
        button { padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #1565c0; }
        .api-check { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .api-item { padding: 8px; background: #f9f9f9; border-radius: 4px; font-size: 13px; }
        .api-item.ok { border-left: 3px solid #4caf50; }
        .api-item.fail { border-left: 3px solid #f44336; }
    </style>
</head>
<body>
    <h1>🛡️ 切屏检测防护测试 v2.0</h1>
    
    <div class="section">
        <h2>📋 快捷键</h2>
        <div class="shortcuts">
            <div class="shortcut"><code>Alt+Q</code> 开关</div>
            <div class="shortcut"><code>Alt+C</code> 复制</div>
            <div class="shortcut"><code>Alt+V</code> 粘贴</div>
            <div class="shortcut"><code>Alt+S</code> 解锁</div>
            <div class="shortcut"><code>Alt+D</code> 深度解锁</div>
            <div class="shortcut"><code>Alt+1~5</code> 预设</div>
        </div>
    </div>

    <div class="section">
        <h2>🔍 API 伪造检测（核心）</h2>
        <div class="api-check" id="api-check"></div>
        <button onclick="checkAPIs()">重新检测</button>
        <p style="font-size:12px;color:#666;margin-top:10px;">切换到其他标签页再切回来，如果所有项目保持绿色，说明防护有效</p>
    </div>

    <div class="section">
        <h2>📊 检测日志</h2>
        <div id="detection-log"></div>
        <button onclick="clearLog()">清空</button>
        <button onclick="checkAPIs()">检测API</button>
    </div>

    <div class="section">
        <h2>📝 功能测试</h2>
        <p>选中这段文字测试复制，然后按 <code>Alt+C</code></p>
        <input type="text" placeholder="点击这里，按 Alt+V 粘贴">
        <textarea placeholder="或者在这里粘贴"></textarea>
    </div>

    <div class="section">
        <h2>🖼️ iframe 编辑器测试</h2>
        <iframe id="test-iframe" srcdoc='<!DOCTYPE html><html><head><style>body{font-family:sans-serif;padding:10px;margin:0;}</style></head><body contenteditable="true" spellcheck="false"><p>点击这里，按 Alt+V 粘贴内容</p></body></html>'></iframe>
    </div>

    <div class="section">
        <h2>⚠️ 防护状态</h2>
        <div class="status" id="protection-status">检测中...</div>
    </div>

    <script>
        var log = document.getElementById('detection-log');

        function addLog(msg, type) {
            var item = document.createElement('div');
            item.className = 'log-item log-' + type;
            var prefix = type === 'blocked' ? '✓ ' : (type === 'triggered' ? '✗ ' : 'ℹ ');
            item.textContent = '[' + new Date().toLocaleTimeString() + '] ' + prefix + msg;
            log.appendChild(item);
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            log.innerHTML = '';
        }

        // 检测 API 伪造状态
        function checkAPIs() {
            var container = document.getElementById('api-check');
            container.innerHTML = '';
            var status = document.getElementById('protection-status');
            var allOk = true;
            
            var checks = [
                { name: 'visibilityState', expected: 'visible', actual: document.visibilityState },
                { name: 'hidden', expected: false, actual: document.hidden },
                { name: 'hasFocus()', expected: true, actual: document.hasFocus() },
                { name: 'webkitHidden', expected: false, actual: document.webkitHidden },
                { name: 'activeElement', expected: '非null', actual: document.activeElement ? document.activeElement.tagName : 'null' }
            ];
            
            checks.forEach(function(check) {
                var div = document.createElement('div');
                var ok;
                if (check.expected === '非null') {
                    ok = check.actual !== 'null';
                } else if (typeof check.expected === 'boolean') {
                    ok = check.actual === check.expected;
                } else {
                    ok = check.actual === check.expected;
                }
                if (!ok) allOk = false;
                div.className = 'api-item ' + (ok ? 'ok' : 'fail');
                div.innerHTML = '<strong>' + check.name + '</strong><br>期望: ' + check.expected + '<br>实际: ' + check.actual;
                container.appendChild(div);
            });
            
            if (allOk) {
                status.className = 'status success';
                status.textContent = '✓ 防护正常！所有API返回正确值';
                addLog('API检测通过', 'blocked');
            } else {
                status.className = 'status error';
                status.textContent = '✗ 防护异常！部分API返回错误值';
                addLog('API检测失败', 'triggered');
            }
        }
        
        // 初始检测
        setTimeout(checkAPIs, 500);
        
        // 定时检测
        setInterval(checkAPIs, 3000);

        // 初始日志
        addLog('测试页面加载完成', 'info');
        addLog('如果看到右下角"✓ 助手就绪 v2.0"，说明插件已加载', 'info');
        addLog('请切换到其他标签页再切回来，观察API检测结果', 'info');
    </script>
</body>
</html>
